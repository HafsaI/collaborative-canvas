services:
  db:
    image: postgres:16-alpine
    container_name: collaborative-canvas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: canvas
      POSTGRES_PASSWORD: canvas
      POSTGRES_DB: canvas
    ports:
      - "5433:5432"
    volumes:
      - canvas_db_data:/var/lib/postgresql/data

volumes:
  canvas_db_data:
